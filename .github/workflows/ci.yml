name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel and the sdist
        run: |
          python -m pip install build==1.6.1
          python -m build
      - name: Install the wheel in a clean venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --no-index --no-deps dist/*.whl
      # From outside the checkout, so that the source folder can't be imported: the checks test the installed package
      - name: Run the checks against the installed package
        working-directory: ${{ runner.temp }}
        run: |
          python="$RUNNER_TEMP/venv/bin/python"
          "$python" -I -c 'import domino_agui, sys; assert domino_agui.__file__.startswith(sys.prefix), domino_agui.__file__'
          failed=0
          for check in "$GITHUB_WORKSPACE"/tests/check_*.py; do
            echo "== $(basename "$check")"
            "$python" "$check" || failed=1
          done
          exit "$failed"

  # One status for the branch rule on main, whatever the Python versions are
  ci-passed:
    name: CI passed
    needs: check
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check job passed
        env:
          RESULT: ${{ needs.check.result }}
        run: test "$RESULT" = success
